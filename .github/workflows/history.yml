name: Air globe history

on:
  schedule:
    - cron: "30 17 * * *" # 01:30 SGT: yesterday's file, once the SGT day is over
  workflow_dispatch:
    inputs:
      from:
        description: "First day to build, YYYY-MM-DD (SGT). Empty means the same as to. Backfill in chunks of about 2 weeks, one run at a time (GitHub keeps only one pending run), at most about 3 chunks an hour (Open-Meteo limits)."
        required: false
      to:
        description: "Last day to build, YYYY-MM-DD (SGT, must be over). Empty means yesterday."
        required: false
      firms_source:
        description: "Force one FIRMS product for every day, e.g. VIIRS_SNPP_SP. Empty means the script's default."
        required: false

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The script writes every day it can and exits non-zero if some failed. Keep its exit code, commit what was
      # written, and fail the job at the end so the owner sees it.
      - name: Build history
        id: build
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          FIRMS_SOURCE: ${{ inputs.firms_source }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::error::FIRMS_MAP_KEY secret is empty, so the days would have no fires"
            exit 1
          fi
          to="${INPUT_TO:-$(TZ=Asia/Singapore date -d yesterday +%F)}"
          from="${INPUT_FROM:-$to}"
          echo "range=$from..$to" >> "$GITHUB_OUTPUT"
          code=0
          npx tsx scripts/history.ts --from "$from" --to "$to" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit
        env:
          RANGE: ${{ steps.build.outputs.range }}
        run: |
          git config user.name "haze-lah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "data: history $RANGE"
          git pull --rebase --quiet && git push
      # The index changes daily, and a day file that is built again (or was first asked for before jsDelivr saw the branch) would stay stale.
      - name: Purge the CDN copy of the index and of each day built
        env:
          RANGE: ${{ steps.build.outputs.range }}
        run: |
          names=(index)
          from="${RANGE%%..*}"
          to="${RANGE##*..}"
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [[ $from =~ $re && $to =~ $re ]]; then
            for ((t = $(date -ud "$from" +%s); t <= $(date -ud "$to" +%s); t += 86400)); do names+=("$(date -ud "@$t" +%F)"); done
          fi
          for n in "${names[@]}"; do
            curl -fsS "https://purge.jsdelivr.net/gh/sr33r00/haze-lah@main/data/history/$n.json" > /dev/null || echo "::warning::jsDelivr purge failed for $n"
          done
          # jsDelivr resolves @main to the previous commit for a few minutes after a push, so a purge then can cache the old index
          # again (it once kept an August-only copy, and visitors who cannot reach GitHub's raw host lost every later bar).
          # Purge the index until the CDN's copy is the one just committed.
          want=$(jq -r .updated data/history/index.json)
          for try in 1 2 3 4 5 6 7 8; do
            got=$(curl -fsS "https://cdn.jsdelivr.net/gh/sr33r00/haze-lah@main/data/history/index.json" | jq -r .updated || true)
            [[ $got == "$want" ]] && { echo "jsDelivr index is current ($got)"; exit 0; }
            echo "jsDelivr index is $got, want $want; purging again in 60 s"
            sleep 60
            curl -fsS "https://purge.jsdelivr.net/gh/sr33r00/haze-lah@main/data/history/index.json" > /dev/null || true
          done
          echo "::warning::jsDelivr still serves an old index.json"
      - name: Fail if some days failed
        if: steps.build.outputs.code != '0'
        env:
          CODE: ${{ steps.build.outputs.code }}
        run: |
          echo "::error::scripts/history.ts exited $CODE: see the failed days in the Build history log"
          exit "$CODE"
