name: Readings archive

on:
  schedule:
    - cron: "45 17 * * *" # 01:45 SGT: yesterday's file, once the SGT day is over (after history.yml at 01:30)
  workflow_dispatch:
    inputs:
      from:
        description: "First day to build, YYYY-MM-DD (SGT). Empty means the same as to. A day takes about 5 seconds (NEA is read gently), so a month or two fits one run."
        required: false
      to:
        description: "Last day to build, YYYY-MM-DD (SGT, must be over). Empty means yesterday."
        required: false

permissions:
  contents: write

concurrency:
  group: readings
  cancel-in-progress: false

jobs:
  readings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The script writes every day it can and exits non-zero if a day's NEA part failed. Keep its exit code, commit what was
      # written, and fail the job at the end so the owner sees it.
      - name: Build readings
        id: build
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          if [ -z "$OPENAQ_API_KEY" ]; then
            echo "::warning::OPENAQ_API_KEY secret is empty, so the community sensors are skipped (the days say so)"
          fi
          to="${INPUT_TO:-$(TZ=Asia/Singapore date -d yesterday +%F)}"
          from="${INPUT_FROM:-$to}"
          echo "range=$from..$to" >> "$GITHUB_OUTPUT"
          code=0
          npx tsx scripts/readings.ts --from "$from" --to "$to" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit
        env:
          RANGE: ${{ steps.build.outputs.range }}
        run: |
          git config user.name "haze-lah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/readings
          git diff --cached --quiet || git commit -m "data: readings $RANGE"
          git pull --rebase --quiet && git push
      # The index changes daily, and a day file that is built again would stay stale on the CDN.
      - name: Purge the CDN copy of the index and of each day built
        env:
          RANGE: ${{ steps.build.outputs.range }}
        run: |
          names=(index)
          from="${RANGE%%..*}"
          to="${RANGE##*..}"
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [[ $from =~ $re && $to =~ $re ]]; then
            for ((t = $(date -ud "$from" +%s); t <= $(date -ud "$to" +%s); t += 86400)); do names+=("$(date -ud "@$t" +%F)"); done
          fi
          for n in "${names[@]}"; do
            curl -fsS "https://purge.jsdelivr.net/gh/sr33r00/haze-lah@main/data/readings/$n.json" > /dev/null || echo "::warning::jsDelivr purge failed for $n"
          done
      - name: Fail if some days failed
        if: steps.build.outputs.code != '0'
        env:
          CODE: ${{ steps.build.outputs.code }}
        run: |
          echo "::error::scripts/readings.ts exited $CODE: see the failed days in the Build readings log"
          exit "$CODE"
