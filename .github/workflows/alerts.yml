name: Telegram alerts

on:
  schedule:
    # Hourly at :10: NEA publishes the last hour's reading at about :30 to :45 and the site picks it up within about 35 minutes (it rebuilds its data every 30 minutes).
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Only send a test message to the Telegram channel
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/alert.ts
        env:
          ALERT_TEST: ${{ inputs.test_alert && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit
        run: |
          git config user.name "haze-lah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alert-state.json
          git diff --cached --quiet || git commit -m "data: alert state"
          git pull --rebase --quiet && git push
